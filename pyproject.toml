[project]
name = "p1-ct-test"
version = "0.1.0"
description = "LazyDocs — local RAG from the terminal"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "chromadb>=1.5.9",
    "langchain>=1.3.16",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "neo4j>=6.2.0",
    "pgvector>=0.5.0",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "rich>=15.0.0",
    "structlog>=26.1.0",
    "typer>=0.27.1",
    "yoyo-migrations>=9.0.0",
]

[project.scripts]
ragp1 = "v1.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.16.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/v1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
    "ASYNC",
    "PT",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["v1"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
